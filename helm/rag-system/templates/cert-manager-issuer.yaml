{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ include "rag.fullname" . }}-letsencrypt
  labels:
    {{- include "rag.labels" . | nindent 4 }}
spec:
  acme:
    email: {{ .Values.certManager.issuer.email }}
    server: {{ .Values.certManager.issuer.server }}
    privateKeySecretRef:
      name: {{ include "rag.fullname" . }}-letsencrypt-key
    solvers:
      - http01:
          ingress:
            class: {{ .Values.ingress.className }}
{{- end }}
