apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag.fullname" . }}-config
  labels:
    {{- include "rag.labels" . | nindent 4 }}
data:
  LLM_BACKEND: {{ .Values.backend.env.LLM_BACKEND | quote }}
  VLLM_BASE_URL: {{ .Values.backend.env.VLLM_BASE_URL | quote }}
  INPUT_GUARD: {{ .Values.backend.env.INPUT_GUARD | quote }}
  OUTPUT_GUARD: {{ .Values.backend.env.OUTPUT_GUARD | quote }}
  PII_MASK: {{ .Values.backend.env.PII_MASK | quote }}
  CHROMA_DIR: {{ .Values.backend.env.CHROMA_DIR | quote }}
  MAX_REWRITE_LOOPS: "2"
  VECTOR_TOP_K: "10"
  BM25_TOP_K: "10"
  RERANK_TOP_N: "3"
