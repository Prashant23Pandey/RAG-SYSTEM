{{- if and .Values.vllm.enabled .Values.vllm.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rag.vllmServiceName" . }}
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: vllm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rag.vllmServiceName" . }}
  minReplicas: {{ .Values.vllm.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.vllm.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.monitoring.serviceMonitor.enabled }}
    - type: Pods
      pods:
        metric:
          name: gpu_memory_usage_percent
        target:
          type: AverageValue
          averageValue: "{{ .Values.vllm.autoscaling.targetGPUUtilization }}"
    {{- end }}
    - type: Pods
      pods:
        metric:
          name: vllm_request_queue_depth
        target:
          type: AverageValue
          averageValue: "{{ .Values.vllm.autoscaling.targetRequestQueueDepth }}"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
{{- end }}
