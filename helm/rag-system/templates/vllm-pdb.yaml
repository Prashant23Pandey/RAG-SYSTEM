{{- if and .Values.vllm.enabled .Values.vllm.autoscaling.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rag.vllmServiceName" . }}
  labels:
    {{- include "rag.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "rag.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: vllm
{{- end }}
