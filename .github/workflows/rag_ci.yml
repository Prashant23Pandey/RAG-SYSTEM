name: RAG Pipeline CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  OLLAMA_BASE_URL: "http://localhost:11434"

jobs:
  # -----------------------------------------------------------------------
  # Lint & Type Check
  # -----------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff black

      - name: Ruff check
        run: ruff check .

      - name: Black format check
        run: black --check .

  # -----------------------------------------------------------------------
  # Unit & Integration Tests
  # -----------------------------------------------------------------------
  test:
    name: Pytest Suite
    runs-on: ubuntu-latest
    needs: lint
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        options: >-
          --health-cmd "curl -f http://localhost:11434/api/tags"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Pull Ollama models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama pull llama3.2 &
          ollama pull nomic-embed-text &
          wait

      - name: Run unit tests (no Ollama required)
        run: pytest tests/ -v -m "not slow" -k "TestGradeDocuments or TestTransformQuery" --tb=short

      - name: Run guardrail tests
        run: pytest tests/ -v -k "TestGuardrails" --tb=short

      - name: Run integration tests
        run: pytest tests/ -v -k "TestIntegration" --tb=short

      - name: Run full test suite
        run: pytest tests/ -v --tb=short

  # -----------------------------------------------------------------------
  # RAG Evaluation (Ragas-style)
  # -----------------------------------------------------------------------
  evaluate:
    name: RAG Evaluation
    runs-on: ubuntu-latest
    needs: test
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        options: >-
          --health-cmd "curl -f http://localhost:11434/api/tags"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull Ollama models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama pull llama3.2 &
          ollama pull nomic-embed-text &
          wait

      - name: Run evaluation suite
        run: python eval.py --threshold 0.5

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_reports/
          retention-days: 30

  # -----------------------------------------------------------------------
  # Observability smoke test
  # -----------------------------------------------------------------------
  observability:
    name: Observability Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify observability module loads
        run: python -c "from observability import get_langfuse, trace_node, measure_latency; print('OK')"
